name: Damanik–Fillman build (WIP)

on:
  push:
    paths:
      - 'lean/DamanikFillman/**'
      - 'lean/DamanikFillman.lean'
      - '.github/workflows/book.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore project build cache
        uses: actions/cache@v4
        with:
          path: lean/.lake/build
          key: lake-book-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-book-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
            lake-build-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build DamanikFillman (keep going past failing modules)
        run: |
          set -o pipefail
          lake build DamanikFillman 2>&1 | tee book.log || true
          echo "=================== ERRORS ==================="
          awk '/^error: /{p=1} /^warning: /{p=0} /^(⚠|✔|✖|trace:)/{p=0} p' book.log | head -600 || true
          if grep -q "^error" book.log; then exit 1; fi

      - name: Count sorry
        run: grep -rnE "\bsorry\b" DamanikFillman || echo "no sorry"
